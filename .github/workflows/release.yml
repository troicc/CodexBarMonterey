name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode and verify Swift toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
          python3 - <<'PY'
          import re
          import subprocess

          output = subprocess.check_output(["swift", "--version"], text=True)
          match = re.search(r"Swift version (\d+)\.(\d+)", output)
          assert match, output
          assert tuple(map(int, match.groups())) >= (6, 2), output
          PY

      - name: Resolve release version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0; received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate when configured
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          if [[ -n "$DEVELOPER_ID_P12_BASE64" && -n "$DEVELOPER_ID_P12_PASSWORD" && -n "$CODE_SIGN_IDENTITY" ]]; then
            Scripts/import_signing_certificate.sh
          else
            echo "Developer ID secrets are incomplete; using ad-hoc signing."
            echo "CODE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Validate Monterey compatibility patches
        run: |
          python3 Scripts/test_monterey_patcher.py
          python3 Scripts/test_smoke_contract.py
          python3 Scripts/test_ui_contract.py
          swiftc -typecheck \
            -target arm64-apple-macosx12.0 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            Patches/MontereyCompat.swift

      - name: Configure release build
        env:
          CONFIGURED_BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          CONFIGURED_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          cp Config/build.env.example Config/build.env

          BUNDLE_ID_VALUE="${CONFIGURED_BUNDLE_ID:-com.example.codexbar.monterey}"
          PUBLIC_KEY_VALUE="${CONFIGURED_SPARKLE_PUBLIC_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}"

          sed -i '' "s|APP_VERSION=0.1.0|APP_VERSION=$APP_VERSION|" Config/build.env
          sed -i '' "s|BUILD_NUMBER=1|BUILD_NUMBER=$BUILD_NUMBER|" Config/build.env
          sed -i '' "s|com.yourname.codexbar.monterey|$BUNDLE_ID_VALUE|" Config/build.env
          sed -i '' "s|PASTE_GENERATE_KEYS_PUBLIC_KEY_HERE|$PUBLIC_KEY_VALUE|" Config/build.env
          sed -i '' "s|YOUR_GITHUB_USER/YOUR_REPO|${{ github.repository }}|" Config/build.env

          echo "Release version: $APP_VERSION"
          echo "Bundle identifier: $BUNDLE_ID_VALUE"
          if [[ -z "$CONFIGURED_SPARKLE_PUBLIC_KEY" ]]; then
            echo "Sparkle public key is not configured; this release can be downloaded normally, but secure automatic updates are disabled."
          fi

      - name: Preflight menu app target
        run: |
          export MACOSX_DEPLOYMENT_TARGET=12.0
          swift build -c release --arch arm64 --product CodexBarMonterey

      - name: Build universal app
        run: Scripts/build_universal.sh

      - name: Verify Monterey deployment targets
        run: Scripts/check_macos12_compat.sh "dist/universal/CodexBar Monterey.app"

      - name: Offline bundle smoke test
        env:
          CODEXBAR_SMOKE_OFFLINE: "1"
        run: Scripts/smoke_test_app.sh "dist/universal/CodexBar Monterey.app"

      - name: Notarize and restaple archive when configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ "$CODE_SIGN_IDENTITY" != "-" && -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            Scripts/notarize_app.sh \
              "dist/universal/CodexBar Monterey.app" \
              "releases/CodexBar-Monterey-$APP_VERSION.zip"
            Scripts/check_macos12_compat.sh "dist/universal/CodexBar Monterey.app"
          else
            echo "Notarization credentials are incomplete; publishing the ad-hoc signed build."
          fi

      - name: Generate SHA-256 checksum
        run: |
          cd releases
          shasum -a 256 "CodexBar-Monterey-$APP_VERSION.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CodexBar Monterey ${{ github.ref_name }}
          files: |
            releases/CodexBar-Monterey-${{ env.APP_VERSION }}.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true

      - name: Detect Sparkle signing configuration
        id: sparkle
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -n "$SPARKLE_PUBLIC_KEY" && -n "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sparkle keys are incomplete; skipping signed appcast generation."
          fi

      - name: Generate signed Sparkle appcast
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
          OUTPUT_PATH: ${{ github.workspace }}/appcast.xml
          SPARKLE_VERSION: 2.9.4
        run: Scripts/generate_appcast.sh releases

      - name: Attach appcast to GitHub Release
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" appcast.xml --clobber

      - name: Publish appcast to main
        if: steps.sparkle.outputs.enabled == 'true'
        run: |
          APPCAST_TMP="$(mktemp)"
          cp appcast.xml "$APPCAST_TMP"
          git worktree add /tmp/codexbar-monterey-main origin/main
          cp "$APPCAST_TMP" /tmp/codexbar-monterey-main/appcast.xml
          cd /tmp/codexbar-monterey-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml unchanged"
          else
            git commit -m "Update Sparkle appcast for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Write release link
        run: |
          {
            echo "## GitHub Release published"
            echo
            echo "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
